<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUR FINALE 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-page: #fff5f8;
            --bg-card: #ffffff;
            --accent: #ff85a1;
            --accent-dim: #ffd1dc;
            --text-main: #5a3d5c;
            --text-muted: #a38f9d;
            --border: #f0e6ed;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .cozy-card {
            background-color: var(--bg-card);
            border: 4px solid var(--border);
            border-radius: 24px;
            padding: 25px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(255, 133, 161, 0.25);
            position: relative;
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .countdown-container {
            background: #fff0f5;
            border: 2px dashed var(--accent-dim);
            border-radius: 16px;
            padding: 12px 10px;
            margin-bottom: 20px;
        }
        .countdown-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            display: block;
            margin-bottom: 8px;
        }
        .countdown-timer {
            display: flex;
            justify-content: space-around;
        }
        .time-box span {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
            display: block;
        }
        .time-box p {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* 3-Photo Polaroid Slideshow (Fixed to show whole photos) */
        .slideshow-container {
            position: relative;
            background: white;
            padding: 10px 10px 25px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .slide-img {
            width: 100%;
            max-height: 380px;
            height: auto;
            object-fit: contain;
            background-color: #faf7f9;
            border-radius: 4px;
            display: none;
            margin: 0 auto;
        }
        .slide-img.active { display: block; }
        .polaroid-caption {
            font-family: 'Dancing Script', cursive;
            font-size: 1.3rem;
            margin-top: 8px;
            color: var(--text-main);
        }

        /* Voice Note Section */
        .voice-section {
            margin-bottom: 20px;
        }
        .voice-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff8fb;
            border: 2px solid var(--accent-dim);
            border-radius: 16px;
            padding: 12px 16px;
        }
        .voice-info {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }
        .voice-icon { font-size: 1.6rem; }
        .voice-title { font-weight: 700; font-size: 0.9rem; }
        .voice-sub { font-size: 0.75rem; color: var(--text-muted); }

        .play-btn {
            background: var(--accent);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 3px 10px rgba(255, 133, 161, 0.4);
        }
        .play-btn:hover {
            transform: scale(1.08);
            background-color: #ff758f;
        }

        /* Memory Buttons */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .mem-btn {
            background: white;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 10px 5px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-main);
            transition: all 0.2s;
        }
        .mem-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* Responsive Video Player Frame */
        .video-frame {
            background: #000;
            padding: 4px;
            border: 2px solid var(--accent-dim);
            border-radius: 16px;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-frame video {
            width: 100% !important;
            height: auto !important;
            max-width: 100% !important;
            max-height: 80vh !important;
            border-radius: 10px;
            object-fit: contain !important;
            display: block;
            margin: 0 auto;
        }

        /* Letter Display */
        .letter-box {
            background-color: #fff8f5;
            border: 2px dashed var(--accent);
            padding: 15px;
            border-radius: 14px;
            min-height: 70px;
            font-size: 0.9rem;
            line-height: 1.5;
            text-align: left;
            margin-bottom: 15px;
        }

        .cute-btn {
            background: linear-gradient(135deg, #ff94b1, #ff758f);
            color: white;
            border: none;
            padding: 16px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            width: 100%;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(255, 133, 161, 0.4);
        }

        .floating-heart {
            position: fixed;
            pointer-events: none;
            font-size: 1.5rem;
            z-index: 1000;
            animation: floatUp 1.2s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
        }
    </style>
</head>
<body onclick="spawnHeart(event)">

    <canvas id="fireworksCanvas" style="position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:1;"></canvas>

    <div class="cozy-card">
        <h1>WE MADE IT! 🎉</h1>

        <!-- Countdown -->
        <div class="countdown-container">
            <span class="countdown-label">FINAL COUNTDOWN TO AUGUST 26TH AT 5 PM ⌛</span>
            <div class="countdown-timer">
                <div class="time-box"><span id="days">00</span><p>Days</p></div>
                <div class="time-box"><span id="hours">00</span><p>Hours</p></div>
                <div class="time-box"><span id="minutes">00</span><p>Mins</p></div>
                <div class="time-box"><span id="seconds">00</span><p>Secs</p></div>
            </div>
        </div>

        <!-- 3-Photo Automatic Slideshow -->
        <div class="slideshow-container">
            <img class="slide-img active" src="us.jpg" alt="Photo 1">
            <img class="slide-img" src="us1.jpg" alt="Photo 2">
            <img class="slide-img" src="us2.jpg" alt="Photo 3">
            <div class="polaroid-caption" id="slide-caption">Through every kilometer... ✈️</div>
        </div>

        <!-- Good Morning Voice Message Section -->
        <div class="voice-section">
            <div class="voice-card">
                <div class="voice-info">
                    <span class="voice-icon">☀️</span>
                    <div>
                        <div class="voice-title">Final Good Morning Note</div>
                        <div class="voice-sub">Listen before your day starts 💖</div>
                    </div>
                </div>
                <button class="play-btn" id="voice-btn" onclick="toggleMorningVoice(event)">▶</button>
            </div>
            <audio id="morning-audio" src="morning.mp3" preload="auto"></audio>
        </div>

        <!-- Memory Buttons -->
        <div class="memory-grid">
            <button class="mem-btn" onclick="revealMemory('stats')">📊 OUR STATS</button>
            <button class="mem-btn" onclick="revealMemory('quote')">💖 FAVORITE QUOTE</button>
            <button class="mem-btn" onclick="revealMemory('promise')">🤝 MY PROMISE</button>
        </div>

        <!-- Master Video Player (In-line playback enabled) -->
        <div class="video-frame">
            <video id="memory-video" controls playsinline webkit-playsinline preload="auto">
                <source src="video.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Dynamic Output Box -->
        <div class="letter-box">
            <span id="output-text">Tap any button above or read your final letter below! 💌</span>
        </div>

        <button class="cute-btn" onclick="typeLetter()">OPEN FINAL LETTER ✉️</button>
    </div>

<script>
    // Countdown Engine
    const targetDate = new Date("August 26, 2026 17:00:00").getTime();
    function updateCountdown() {
        const diff = targetDate - new Date().getTime();
        if (diff > 0) {
            document.getElementById("days").innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
            document.getElementById("hours").innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            document.getElementById("minutes").innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            document.getElementById("seconds").innerText = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
        } else {
            document.querySelector(".countdown-container").innerHTML = "<b style='color:#ff85a1;'>🎉 NO MORE DISTANCE! SEE YOU NOW! ❤️</b>";
        }
    }
    setInterval(updateCountdown, 1000); updateCountdown();

    // Photo Slideshow Cycle
    const slides = document.querySelectorAll('.slide-img');
    const captions = [
        "Through every single kilometer... ✈️",
        "Every call, every sweet memory... 📱💖",
        "Now starting our next chapter! 👑"
    ];
    let slideIdx = 0;
    setInterval(() => {
        slides[slideIdx].classList.remove('active');
        slideIdx = (slideIdx + 1) % slides.length;
        slides[slideIdx].classList.add('active');
        document.getElementById('slide-caption').innerText = captions[slideIdx];
    }, 3500);

    // Morning Voice Control Logic
    const morningAudio = document.getElementById('morning-audio');
    const voiceBtn = document.getElementById('voice-btn');
    const memoryVideo = document.getElementById('memory-video');

    function toggleMorningVoice(e) {
        e.stopPropagation();
        
        if (memoryVideo && !memoryVideo.paused) {
            memoryVideo.pause();
        }

        if (morningAudio.paused) {
            morningAudio.play();
            voiceBtn.innerText = "❚❚";
        } else {
            morningAudio.pause();
            voiceBtn.innerText = "▶";
        }
    }

    morningAudio.onended = function() {
        voiceBtn.innerText = "▶";
    };

    if (memoryVideo) {
        memoryVideo.addEventListener('play', () => {
            if (!morningAudio.paused) {
                morningAudio.pause();
                voiceBtn.innerText = "▶";
            }
        });
    }

    // Memory Buttons Logic
    const memories = {
        stats: "✈️ Thousands of km crossed<br>📱 100s of hours on call<br>💖 1 Unbreakable Bond!",
        quote: "'Distance means so little when someone means so much.'",
        promise: "I promise to hold you tight, make you laugh, and never let go."
    };
    function revealMemory(key) {
        document.getElementById("output-text").innerHTML = memories[key];
    }

    // Typewriter Letter
    const finalLetterText = "My Dearest Wifey,\n\nThis website was built to bridge every kilometer between us. Today, it goes quiet because the distance is finally over.\n\nThank you for being my constant, my favorite thought, and my home. See you right now! ❤️";
    let i = 0;
    function typeLetter() {
        const box = document.getElementById("output-text");
        box.innerHTML = ""; i = 0;
        function step() {
            if (i < finalLetterText.length) {
                const char = finalLetterText.charAt(i);
                box.innerHTML += (char === '\n') ? '<br>' : char;
                i++; setTimeout(step, 30);
            }
        }
        step();
    }

    // Floating Hearts
    function spawnHeart(e) {
        const heart = document.createElement("div");
        heart.className = "floating-heart";
        heart.innerHTML = "💖";
        heart.style.left = e.clientX + "px";
        heart.style.top = e.clientY + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1200);
    }

    // Fireworks
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y; this.color = color;
            this.radius = Math.random() * 3 + 1;
            this.velocity = { x: (Math.random() - 0.5) * 8, y: (Math.random() - 0.5) * 8 };
            this.alpha = 1; this.friction = 0.98; this.gravity = 0.05;
        }
        draw() {
            ctx.save(); ctx.globalAlpha = this.alpha;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color; ctx.fill(); ctx.restore();
        }
        update() {
            this.velocity.x *= this.friction; this.velocity.y *= this.friction;
            this.velocity.y += this.gravity;
            this.x += this.velocity.x; this.y += this.velocity.y;
            this.alpha -= 0.015;
        }
    }
    let particles = [];
    const colors = ['#ff85a1', '#ffd1dc', '#ffda79', '#a29bfe', '#fab1a0', '#ffffff'];
    function animateFireworks() {
        requestAnimationFrame(animateFireworks);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (Math.random() < 0.07) {
            const rx = Math.random() * canvas.width;
            const ry = Math.random() * (canvas.height * 0.6);
            const col = colors[Math.floor(Math.random() * colors.length)];
            for (let k = 0; k < 45; k++) particles.push(new Particle(rx, ry, col));
        }
        particles.forEach((p, idx) => {
            if (p.alpha > 0) { p.update(); p.draw(); } else particles.splice(idx, 1);
        });
    }
    animateFireworks();
</script>
</body>
</html>
